# =============================================================================
# DanmakuStudio 用户配置文件
# =============================================================================
# 修改此文件后重新运行程序即可生效。
# 删除此文件或删除某个字段，该字段将恢复为内置默认值。
# 不需要修改的字段可以整行删除或注释掉。

# =============================================================================
# 布局样式 — 弹幕气泡的外观、间距和字体
# =============================================================================
style:
  danmaku_x: 10                 # 弹幕起始 X 坐标（像素）
  layer_width_extra: 100        # 渲染层额外宽度（像素）
  bubble_padding_x: 14          # 气泡水平内边距（像素）
  bubble_padding_y: 5           # 气泡垂直内边距（像素）
  bubble_row_gap: 5             # 气泡行间距（像素）
  bubble_vertical_gap: 4        # 气泡垂直间距（像素）
  bubble_multiline_radius: 10.0 # 多行气泡圆角半径（像素）
  gift_spacing: 6               # 礼物图标间距（像素）
  emoji_spacing: 4              # Emoji 间距（像素）
  font_size: 18                 # 字体大小（pt）
  fade_out_zone: 20.0           # 淡出区域高度（像素）

# =============================================================================
# 布局参数 — 弹幕区域行数和宽度比例
# =============================================================================
ratio:
  max_text_rows: 8              # 文本弹幕最多显示行数
  max_gift_rows: 2              # 礼物弹幕最多显示行数
  text_width_ratio: 0.8         # 文本弹幕最大宽度比例
  bottom_margin: 12             # 底部边距（像素）

# =============================================================================
# 动画参数 — 弹幕发射、移动速度和停留时间
# =============================================================================
animation:
  text_damping_factor: 0.1     # 文本弹幕移动阻尼系数（0~1，越大越快）
  gift_damping_factor: 0.1     # 礼物弹幕移动阻尼系数（0~1，越大越快）
  text_spawn_interval: 0.5      # 文本弹幕发射间隔（秒）
  text_spawn_batch_size: 3      # 文本弹幕每次发射数量
  gift_spawn_interval: 0.5      # 礼物弹幕发射间隔（秒）
  gift_spawn_batch_size: 2      # 礼物弹幕每次发射数量
  gift_dwell_time: 5.0          # 礼物停留时间（秒），null=永不消失
  min_gift_price: 0.0           # 最低礼物价格（元），低于此值不显示

# =============================================================================
# 编码参数 — FFmpeg 硬件/软件编码配置（高级用户）
# =============================================================================
# encode:
#   gpu_preset: "p5"             # NVIDIA NVENC 预设（p1~p7，越大越慢、质量越好）
#   gpu_cq: 15                   # NVIDIA NVENC QP 质量（1~51，越小越好、文件越大）
#   qsv_preset: "slow"           # Intel QSV 预设（越慢通常质量越好）
#   qsv_quality: 18              # Intel QSV 质量（1~51，越小越好、文件越大）
#   cpu_preset: "medium"         # libx264 预设（越慢压缩效率越好）
#   cpu_crf: 18                  # libx264 CRF 质量（0~51，越小越好、文件越大）
#   cpu_min_reserve_threads: 2   # CPU 编码保留线程数

# =============================================================================
# 系统参数 — 管道缓冲和进程管理（高级用户）
# =============================================================================
# system:
#   pipe_buffer_size: 10000000   # 管道缓冲区大小（字节）
#   ffmpeg_timeout: 10           # FFmpeg/ffprobe 检测与元数据读取超时（秒）
#   stderr_thread_timeout: 5     # 错误日志线程超时（秒）
#   video_alignment: 2           # 视频尺寸对齐到偶数，避免 1080 被放大到 1088
